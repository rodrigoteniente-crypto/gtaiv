[Suscriptor]
; Accion "Npc": aparece una persona con el nombre del que se suscribio arriba de la cabeza
; y la camara la sigue. Segun los meses de suscripcion hace otra cosa:
;   Pasear  = camina por la ciudad          Pelea   = se agarra a pinas (despues cae la policia)
;   Huir    = se escapa en auto y la policia lo persigue
;   Tiroteo = se tirotea con la policia hasta que lo bajan
;   Arrasar = armado contra todos, muy resistente          Azar = cualquiera
Nivel1          = Tiroteo     ; perfil corregido: combate dirigido y patrullas
Nivel2          = Tiroteo     ; perfil corregido: combate dirigido y patrullas
Nivel2Desde     = 2           ; meses
Nivel3          = Tiroteo     ; perfil corregido: combate dirigido y patrullas
Nivel3Desde     = 6
Nivel4          = Arrasar     ; mejor equipo para veteranos/regalos
Nivel4Desde     = 12
Regalo          = Arrasar     ; mejor equipo para veteranos/regalos
Otros           = Pasear      ; desde un comando del chat, follow, host...
Maximo          = 8           ; NPC a la vez (si llega otro, se va el mas viejo)
TiempoMaximo    = 900         ; segundos; si sigue vivo despues, se va
DuracionPasear  = 600
Patrulleros     = 2           ; perfil corregido: permite que lleguen policias
Vida            = 1           ; multiplica la vida (2 = el doble de dificil de matar)
Autos           = SULTAN,BANSHEE,INFERNUS,COMET,FEROCI,PMP600,BUFFALO,TURISMO
VelocidadAuto   = 40
; --- bandas ---
; Cada vez que mata a un policia aparece otro de su banda al lado ("la banda de ..."), hasta BandaMaximo.
; Se cubren detras de los autos, corren hacia la policia, y si no hay nadie se roban un auto (juntos).
; Con poca vida buscan un auto y escapan; si pierden a la policia se van a comprar comida y vuelven con toda la vida.
BandaMaximo     = 4
SeDuplicaCon    = Cualquiera      ; Policias / PoliciasYBandas / Cualquiera
PelearEntreEllos = si         ; si hay dos o mas bandas, se buscan entre ellas para matarse
SegundosPorMuerte = 120       ; cada muerte le suma tiempo a su reloj (0 = nada)
VidaParaHuir    = 50          ; % de vida para salir a escapar (0 = nunca)
SegundosComiendo = 6
TraerBandas     = si          ; si otra banda esta a mas de 350 m, aparecen cerca de ella (fuera de camara)
CoberturaDelJuego = si        ; sin autos cerca, usa la cobertura del juego
Diagnostico     = si          ; detalle en log.txt de lo que hace cada uno
ApareceLejos    = si          ; si ya hay otra banda cerca, aparece en otra camara lejos (despues se cruzan)
BandasRecorren  = si          ; la banda completa (4) sale en auto a recorrer la ciudad buscando a otras
CambianDeAuto   = si          ; cada tanto se bajan del auto y se roban otro
KillFeed        = si          ; quien mato a quien, arriba a la derecha (tecla KillFeed)
Ranking         = no          ; ranking de kills en pantalla al iniciar (tecla Ranking; ranking.ini / ranking.txt)
