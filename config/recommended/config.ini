Orden               = aleatorio   ; secuencial | aleatorio
DuracionPorDefecto  = 300         ; segundos por plano
FOVPorDefecto       = 25          ; FOV bajo = efecto teleobjetivo (el juego normal usa ~50)
Transicion          = corte       ; fundido | corte
FundidoMs           = 0
EsperaCargaMs       = 0           ; tiempo en negro para que aparezcan autos y gente en el plano nuevo
Balanceo            = 0           ; leve movimiento "camara en mano" (0 = fija)
NoCortarTrasAccion  = 8           ; no cambia de plano hasta X segundos despues de una accion
EsperaMaximaExtra   = 60          ; pero nunca alarga un plano mas de X segundos (si el chat no para)
AlturaJugadorOculto = 20          ; Niko flota invisible X metros arriba del lugar de la accion
HoraFija            = 22:00       ; ej 19:30  (vacio = la hora corre normal)
