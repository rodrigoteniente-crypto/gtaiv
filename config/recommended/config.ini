; ==================================================================================
;  KickChaos IV  -  el chat de Kick controla Liberty City
;  Lo mas facil: en el juego apreta F8 y cambia todo desde el MENU (se guarda solo en este archivo).
;  Si editas este archivo a mano, despues apreta F5 en el juego para recargarlo.
;  Lo que va despues de un ";" es un comentario y se ignora.
; ==================================================================================

[Kick]
Canal = rodsquare
; IDs del chat de rodsquare (ya estan puestos). Si cambias de canal ponelos en 0 y el mod intenta buscarlos solo.
ChatroomId = 31759082
ChannelId = 32047403
Conectar = si
; Mensajes de estos usuarios se ignoran (bots), separados por coma
IgnorarUsuarios = BotRix, KickBot


[Comandos]
; palabra del chat = Accion | quien puede | cooldown propio (segundos)
;   - Si empieza con "!" tiene que estar al principio del mensaje.  Ej: "!boom" o "!boom jajaja"
;   - Si NO empieza con "!", alcanza con que la palabra aparezca en cualquier parte del mensaje.
;   - No importan mayusculas ni tildes ("Explotá" = "explota").
;   - Quien puede: todos (si no pones nada), sub, vip, mod, streamer.
;   - Se pueden combinar acciones con "+" y repetir con "*":  Explosion*3   Bombardeo+Policia
;
; Acciones disponibles:
;   Explosion, Bombardeo, ExplotarCoches, Policia, Persecucion, Bomberos, Fuego, LluviaDeCoches,
;   Disturbio, Panico, Tormenta, Noche, Dia, Atardecer, CamaraLenta, Terremoto, SiguienteCamara


; Palabras sueltas: si alguien las escribe en cualquier parte del mensaje, pasa la accion


[Eventos]
; Que pasa cuando hay un evento del canal
Suscripcion  = Npc                                             ; sub nueva o re-sub: aparece con su nombre (ver seccion Suscriptor)
RegaloSubs   = Npc                                             ; el NPC aparece una vez; lo demas se repite por cada sub regalada
Follow       = Nada         ; los follows no ocupan lugares de suscriptores
Host         = Nada                                ; cuando te hostean / raid
Ban          = Nada                        ; cuando un mod banea a alguien
Mensaje      = Nada                        ; CUALQUIER mensaje del chat (respeta los cooldowns)
; Kicks (regalos de Kick). Si en log.txt aparece  evento no reconocido 'X'  podes asignarlo aca:  X = Accion
KicksGifted  = Persecucion+Bomberos
ChatAFull = Bombardeo
KicksGrandes = Disturbio
RewardRedeemedEvent = Nada


[Reglas]
UnaAccionPorMensaje     = si
SeparacionEntreAcciones = 2       ; segundos entre una accion y la siguiente de la cola
CooldownPorUsuario      = 0       ; cada persona puede disparar algo cada X segundos (el streamer no tiene limite)
ColaMaxima              = 15
EventosIgnoranCooldown  = si      ; subs, regalos y follows siempre disparan
MaxRepeticiones         = 10
RepetirPorCadaRegalo    = si      ; 5 subs regaladas = la accion de RegaloSubs 5 veces
AvisoEnJuego            = no      ; mostrar "usuario -> ACCION" como subtitulo dentro del juego
ArchivoOBS              = ultimo_evento.txt   ; texto para una fuente de texto de OBS ("leer desde archivo")
BorrarTextoOBSTras      = 12      ; segundos (0 = no borrar)
ChatAFullMensajes = 100
ChatAFullSegundos = 40
ChatAFullCooldown = 10
KicksGrandesDesde = 100
RegaloGrandeDesde = 2


[Cooldowns]
