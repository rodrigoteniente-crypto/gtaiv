[TeclasDePrueba]
; Opcional: teclas para disparar acciones sin el chat (tambien esta "Probar acciones" en el menu F8).
; Ejemplo:   Insert = Explosion      Home = evento:Suscripcion      End = evento:RegaloSubs:5

