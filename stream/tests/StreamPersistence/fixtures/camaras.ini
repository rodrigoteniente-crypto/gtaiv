; ==================================================================================
;  KickChaos IV  -  camaras del director
;
;  La forma facil: en el juego apreta F8 (menu) > "Crear camara nueva", o F7 directo.
;  Move la camara y apreta ENTER para guardar. Se agregan solas a este archivo y el director
;  las recorre en loop. Duracion, zoom, transicion, hora y clima de cada una: F8 > Mis camaras.
;
;  Controles del editor:
;    W A S D = mover      Q / E = bajar / subir      SHIFT = rapido   CTRL = lento
;    Mouse o I J K L = girar                          Z / X = menos / mas FOV (zoom)
;    ENTER = guardar camara nueva   (el marcador rojo muestra donde van a pasar las explosiones, policia, etc.)
;    T = fijar el "objetivo" de la ultima camara en lo que estas mirando ahora
;        (util con FOV muy bajo y lugares lejanos: acercate, apunta al lugar y apreta T)
;    SHIFT + ENTER = guardar la posicion actual como PUNTO FINAL de la ultima camara
;                    (la camara se desliza lentamente de un punto al otro durante el plano)
;    RETROCESO = borrar la ultima camara        F7 = salir del editor      F9 = probar el loop
;
;  Mientras no haya ninguna camara guardada, el director arma planos automaticos.
;
;  Campos de cada camara (se pueden editar a mano; el nombre entre [] es libre):
;    Pos        = x, y, z               posicion
;    Rot        = inclinacion, giro, rumbo  (grados)   - o bien -   MirarA = x, y, z
;    FOV        = 25                    zoom (bajo = teleobjetivo)
;    Duracion   = 20                    segundos en pantalla
;    PosFinal / RotFinal / FOVFinal     opcional: movimiento lento durante el plano
;    Objetivo   = x, y, z               donde ocurren explosiones, policia, etc. (se calcula al guardar)
;    Hora       = 21:30                 opcional: hora del dia para este plano
;    Clima      = lluvia                opcional: extrasoleado, soleado, ventoso, nublado, lluvia, llovizna, niebla, tormenta
;    Balanceo   = 0.25                  opcional: movimiento "camara en mano" de este plano
;    Activa     = no                    opcional: la camara queda guardada pero no entra en el loop
;    Transicion = fundido / corte       opcional: como se llega a esta camara (si no, la general)
; ==================================================================================

;    Pos        = x, y, z               posicion
;    Rot        = inclinacion, giro, rumbo  (grados)   - o bien -   MirarA = x, y, z
;    FOV        = 25                    zoom (bajo = teleobjetivo)
;    Duracion   = 20                    segundos en pantalla
;    PosFinal / RotFinal / FOVFinal     opcional: movimiento lento durante el plano
;    Objetivo   = x, y, z               donde ocurren explosiones, policia, etc. (se calcula al guardar)
;    Hora       = 21:30                 opcional: hora del dia para este plano
;    Clima      = lluvia                opcional: extrasoleado, soleado, ventoso, nublado, lluvia, llovizna, niebla, tormenta
;    Balanceo   = 0.25                  opcional: movimiento "camara en mano" de este plano
; ==================================================================================

